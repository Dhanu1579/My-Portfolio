<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="D S initials avatar">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#1b3b8b"/>
      <stop offset="60%" stop-color="#3858a6"/>
      <stop offset="100%" stop-color="#6b4cff"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offset"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.4" specularExponent="15" lighting-color="#ffffff" result="specOut">
        <fePointLight x="-5000" y="-10000" z="20000"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specComp"/>
      <feMerge>
        <feMergeNode in="specComp"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="376" height="376" rx="34" fill="url(#g1)" opacity="0.98" />
  <rect x="20" y="20" width="360" height="360" rx="22" fill="#041226" opacity="0.9" filter="url(#emboss)" />

  <g transform="translate(0,6)">
    <text x="50%" y="52%" text-anchor="middle" fill="#fff" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="800" font-size="112">DS</text>
  </g>
</svg>
